
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Text Extractor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📸 Image Text Extractor</h1>
            <p>Upload an image to extract text using Google Gemini AI</p>
        </header>

        <div class="upload-section">
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
            <button id="uploadBtn" class="upload-btn">Choose Image</button>
            <div id="fileName" class="file-name"></div>
        </div>

        <div id="imagePreview" class="image-preview"></div>

        <button id="extractBtn" class="extract-btn" disabled>Extract Text</button>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Extracting text...</p>
        </div>

        <div id="resultSection" class="result-section" style="display: none;">
            <h2>Extracted Text:</h2>
            <textarea id="extractedText" class="text-box" readonly></textarea>
            <button id="copyBtn" class="copy-btn">Copy to Clipboard</button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
